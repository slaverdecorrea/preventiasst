<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Seguridad y salud en el trabajo</title>
  <desc id="d">Casco de seguridad, escudo con check, tablero de cumplimiento y trabajadores</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1090" cy="60" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="160" cy="330" r="150" fill="#ffffff" opacity="0.05"/>

  <!-- Tablero de cumplimiento -->
  <g transform="translate(700 70)">
    <rect width="380" height="220" rx="18" fill="#ffffff" opacity="0.97"/>
    <text x="28" y="52" font-family="Space Grotesk, DM Sans, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Cumplimiento SG-SST</text>
    <text x="28" y="108" font-family="Space Grotesk, DM Sans, sans-serif" font-size="56" font-weight="700" fill="#0D9488">82%</text>
    <rect x="28" y="140" width="324" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="28" y="140" width="266" height="12" rx="6" fill="#0D9488"/>
    <rect x="28" y="172" width="104" height="10" rx="5" fill="#5EEAD4"/>
    <rect x="144" y="172" width="90" height="10" rx="5" fill="#99F6E4"/>
    <rect x="246" y="172" width="106" height="10" rx="5" fill="#CCFBF1"/>
    <text x="28" y="204" font-family="DM Sans, sans-serif" font-size="13" fill="#475569">Datos de ejemplo</text>
  </g>

  <!-- Escudo con check -->
  <g transform="translate(470 80)">
    <path d="M120 0 L230 40 L230 130 C230 200 180 245 120 270 C60 245 10 200 10 130 L10 40 Z" fill="#5EEAD4"/>
    <path d="M120 22 L208 56 L208 130 C208 186 168 224 120 246 C72 224 32 186 32 130 L32 56 Z" fill="#ffffff"/>
    <path d="M80 135 L110 166 L162 108" fill="none" stroke="#0F766E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Casco -->
  <g transform="translate(60 90)">
    <path d="M30 120 C30 40 100 0 190 0 C280 0 350 40 350 120 L350 140 L30 140 Z" fill="#FACC15"/>
    <rect x="10" y="132" width="360" height="26" rx="13" fill="#EAB308"/>
    <path d="M90 60 C120 36 170 30 200 34" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <rect x="150" y="174" width="100" height="22" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="60" y="210" width="280" height="20" rx="10" fill="#ffffff" opacity="0.25"/>
    <rect x="90" y="236" width="220" height="20" rx="10" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- Trabajadores -->
  <g fill="#ffffff" opacity="0.92" transform="translate(420 230)">
    <circle cx="0" cy="0" r="14"/><rect x="-18" y="18" width="36" height="60" rx="14"/>
    <circle cx="48" cy="6" r="14"/><rect x="30" y="24" width="36" height="60" rx="14"/>
  </g>
</svg>
